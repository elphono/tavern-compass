name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The plugin build downloads HDT's assemblies (a 20 MB zip) into lib/hdt/: keep them between runs.
      - uses: actions/cache@v4
        with:
          path: lib/hdt
          key: hdt-${{ hashFiles('src/BronzebeardHud.HdtPlugin/BronzebeardHud.HdtPlugin.csproj') }}

      - name: Formatting
        run: dotnet format whitespace --folder --verify-no-changes .

      - name: Tests (business logic)
        run: dotnet test BronzebeardHud.sln -c Release -warnaserror

      # The anti-dance mod's log reader (tools/nodance-observe.py): standard Python, synthetic logs.
      - name: Tests (log reader of the anti-dance mod)
        run: python3 tools/test_nodance_observe.py

      - name: Build the HDT plugin
        run: dotnet build src/BronzebeardHud.HdtPlugin -c Release -warnaserror

      - name: Build the simulation harness
        run: dotnet build tools/BronzebeardHud.Harness -c Release -warnaserror

      - name: Build the stats inspection tool
        run: dotnet build tools/BronzebeardHud.Inspect -c Release -warnaserror
